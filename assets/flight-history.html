<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flight History Map</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#3e5765;background:#fff;font-size:14px;}
*{box-sizing:border-box;}
body{margin:0;overflow:hidden;background:#fff;}
.map{width:100%;}
.toolbar{min-height:60px;padding:10px 15px;display:flex;align-items:center;justify-content:flex-start;gap:10px;flex-wrap:wrap;border-bottom:1px solid #e3edf2;}
.filter{display:flex;align-items:center;gap:10px;font-weight:600;white-space:nowrap;}
select{font:inherit;min-width:118px;max-width:145px;border-radius:5px;padding:8px 10px;background:#fff;border:1px solid #d5e2ea;color:#456678;}
select:disabled{opacity:.55;}
.canvas{position:relative;width:100%;height:350px;background:#f4f9fb;overflow:hidden;}
.canvas svg{display:block;width:100%;height:100%;touch-action:none;cursor:grab;}
.canvas svg.dragging{cursor:grabbing;}
.land{fill:#dce8e9;stroke:#bdcfd4;stroke-width:.68;stroke-linejoin:round;}
.grid{stroke:#e0ebf1;stroke-width:.9;fill:none;pointer-events:none;}
.route{fill:none;stroke:#267d9c;stroke-opacity:.75;stroke-width:2.3;stroke-linecap:round;pointer-events:none;vector-effect:non-scaling-stroke;}
.route.focus{stroke:#d48741;stroke-width:3.7;stroke-opacity:1;}
.route-hit{fill:none;stroke:transparent;stroke-width:16;vector-effect:non-scaling-stroke;pointer-events:stroke;cursor:pointer;}
.route-hit:focus-visible{stroke:rgba(207,127,49,.24);outline:none;}
.dot{fill:#287e9a;stroke:#fff;stroke-width:1.6;vector-effect:non-scaling-stroke;cursor:pointer;}
.dot:focus-visible{stroke:#df883d;stroke-width:3;outline:none;}
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:4px;}
.zoom button{font:600 19px/1 sans-serif;color:#597080;background:#fff;border:1px solid #cfdce3;border-radius:5px;width:31px;height:31px;padding:0;cursor:pointer;}
.zoom button:hover{background:#e9f5fa;}
#zoom-world{font-size:16px;}
.zoom button:focus-visible,select:focus-visible{outline:2px solid #277caa;outline-offset:2px;}
/* No permanent statistics or instructions underneath the map. */
#zoom-reset{font-size:12px;font-weight:750;letter-spacing:.02em;}
.flight-card{position:absolute;left:12px;bottom:12px;z-index:5;max-width:min(365px,calc(100% - 24px));max-height:65%;overflow:auto;padding:12px 40px 12px 13px;border:1px solid #ccdce3;border-radius:9px;background:rgba(255,255,255,.97);box-shadow:0 4px 19px rgba(28,61,79,.17);font-size:13px;line-height:1.5;color:#4b6573;}
.flight-card[hidden],.flight-tip[hidden],.flight-alert[hidden]{display:none!important;}
.flight-card strong{display:block;margin-bottom:5px;color:#26586e;font-size:14px;}
.flight-card .record{margin:4px 0;overflow-wrap:anywhere;}
.flight-card__close{position:absolute;right:7px;top:4px;font:20px/1.2 sans-serif;border:0;background:transparent;color:#65808e;cursor:pointer;width:30px;height:28px;}
.flight-card__close:hover{color:#223d4b;}
.flight-tip{position:absolute;z-index:6;pointer-events:none;max-width:230px;border-radius:5px;padding:6px 9px;background:#244b5e;color:white;box-shadow:0 3px 9px rgba(20,44,57,.2);font-size:12px;line-height:1.4;white-space:normal;}
.flight-alert{position:absolute;left:12px;bottom:12px;right:12px;z-index:8;padding:9px 12px;background:rgba(255,250,238,.98);border:1px solid #e1c494;border-radius:6px;color:#795320;font-size:13px;}
.route.hover{stroke:#e29c51;stroke-width:3.5;stroke-opacity:1;}
@media(max-width:600px){.toolbar{padding:10px;min-height:66px;}.canvas{height:310px;}.zoom{right:9px;top:9px;}.flight-card{left:8px;bottom:8px;max-width:calc(100% - 16px);max-height:65%;}.flight-tip{max-width:185px;}}
</style>
</head>

    card.hidden=false;
  }
  function hideDetails(){card.hidden=true;routeLayer.querySelectorAll('.route').forEach(p=>p.classList.remove('focus'));}
  $('flight-close').addEventListener('click',hideDetails);
  function tipFor(event,text){
    const bounds=map.getBoundingClientRect(),holder=$('canvas').getBoundingClientRect();
    const clientX=event.clientX||bounds.left+bounds.width/2,clientY=event.clientY||bounds.top+bounds.height/2;
    tip.textContent=text;tip.hidden=false;
    const x=Math.max(6,Math.min(holder.width-tip.offsetWidth-7,clientX-holder.left+12));
    const y=Math.max(5,Math.min(holder.height-tip.offsetHeight-7,clientY-holder.top+12));
    tip.style.left=x+'px';tip.style.top=y+'px';
  }
  function transform(){
    content.setAttribute('transform','translate('+view.x+' '+view.y+') scale('+view.k+')');
    tip.hidden=true;
    // SVG circle radii otherwise grow with the zoom and obscure closely spaced airports.
    for(const dot of dotLayer.querySelectorAll('circle'))dot.setAttribute('r',(4.1/view.k).toFixed(3));
  }
  function clampView(){view.x=Math.min(0,Math.max(W-W*view.k,view.x));view.y=Math.min(0,Math.max(H-H*view.k,view.y));}
  function showWorld(){view={k:1,x:0,y:0};transform();}
  function showUnitedStates(){
    // Equirectangular coordinates; center near the central US, while allowing Alaska to appear near the left edge.
    const longitude=-102,latitude=40,zoom=3.70;
    const cx=(longitude+180)*W/360,cy=(90-latitude)*H/180;
    view={k:zoom,x:W/2-zoom*cx,y:H/2-zoom*cy};
    clampView();transform();
  }
  function changeZoom(factor,centerX=W/2,centerY=H/2){
    const next=Math.max(1,Math.min(7,view.k*factor));
    const pX=(centerX-view.x)/view.k,pY=(centerY-view.y)/view.k;
    view={k:next,x:centerX-next*pX,y:centerY-next*pY};clampView();transform();
  }
  function fitSelectedRoutes(groupArray){
    if(yearMenu.value==='all'||!groupArray.length){showUnitedStates();return;}
    let xs=[],ys=[];
    for(const group of groupArray){
      for(const key of [group.a,group.b]){const p=toXY(key);if(p){xs.push(p[0]);ys.push(p[1]);}}
    }
    const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
    const spreadX=Math.max(100,maxX-minX),spreadY=Math.max(60,maxY-minY);
    const k=Math.max(1,Math.min(4.0,Math.min(W*.78/spreadX,H*.72/spreadY)));
    if(k<1.12){showWorld();return;}
    const cx=(minX+maxX)/2,cy=(minY+maxY)/2;
    view={k,x:W/2-k*cx,y:H/2-k*cy};clampView();transform();
  }
  function render(){
    const selected=yearMenu.value==='all'?flights:flights.filter(f=>f.year===yearMenu.value);
    const unique=new Set(),groups=new Map();
    for(const f of selected){
      unique.add(f.from);unique.add(f.to);
      const pair=[f.from,f.to].sort(),key=pair.join('|');
      if(!groups.has(key))groups.set(key,{a:pair[0],b:pair[1],flights:[]});
      groups.get(key).flights.push(f);
    }
    routeLayer.replaceChildren();dotLayer.replaceChildren();hideDetails();tip.hidden=true;
    const gg=Array.from(groups.values());
    for(const g of gg){
      // By assigning each dated flight its own offset, round trips and repeat
      // visits do not collapse to exactly the same visible route.
      g.flights.sort((a,b)=>a.date.localeCompare(b.date)||a.from.localeCompare(b.from)||a.note.localeCompare(b.note));
      g.flights.forEach((f,i)=>{
        const rank=i-(g.flights.length-1)/2;
        // For very short routes, reduce curvature to avoid visual loops.
        const a=toXY(g.a),b=toXY(g.b),distance=Math.hypot(b[0]-a[0],b[1]-a[1]);
        const offset=rank*Math.min(4.8,Math.max(.7,distance*.14));
        const path=greatCircle(g.a,g.b,offset);
        const line=node('path',{d:path,class:'route','data-date':f.date,'data-from':f.from,'data-to':f.to,'data-offset':offset.toFixed(3)},routeLayer);
        const title=f.date+' · '+f.from+' → '+f.to+(f.note?' · '+f.note:'');
        const hit=node('path',{d:path,class:'route-hit',tabindex:0,role:'button','aria-label':title},routeLayer);
        node('title',{},hit).textContent=title;
        const onPick=()=>{
          routeLayer.querySelectorAll('.route').forEach(x=>x.classList.remove('focus'));
          line.classList.add('focus');
          showDetails(f.from+' → '+f.to,[f]);
        };
        hit.addEventListener('click',onPick);
        hit.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();onPick();}});
        hit.addEventListener('pointerenter',event=>{line.classList.add('hover');tipFor(event,title);});
        hit.addEventListener('pointermove',event=>{if(!card.hidden)return;tipFor(event,title);});
        hit.addEventListener('pointerleave',()=>{line.classList.remove('hover');tip.hidden=true;});
        hit.addEventListener('focus',()=>line.classList.add('hover'));
        hit.addEventListener('blur',()=>line.classList.remove('hover'));
      });
    }
    for(const code of [...unique].sort()){
      const a=AIRPORTS[code],p=toXY(code);
      const c=node('circle',{cx:p[0],cy:p[1],r:4.1,class:'dot',role:'button',tabindex:0,'aria-label':code+': '+a[2]},dotLayer);
      node('title',{},c).textContent=code+' · '+a[2];
      const onPick=()=>{routeLayer.querySelectorAll('.route').forEach(x=>x.classList.remove('focus'));showDetails(code+' · '+a[2],selected.filter(f=>f.from===code||f.to===code));};
      c.addEventListener('click',onPick);
      c.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();onPick();}});
    }
    map.dataset.flights=String(selected.length);
    map.dataset.routes=String(groups.size);
    fitSelectedRoutes(gg);
    return selected;
  }
  let invalid=[],duplicates=0;
  async function init(){
    const url=new URL('./data/flights.csv',location.href);
    const ctrl=new AbortController();const stop=setTimeout(()=>ctrl.abort(),7000);
    let text;
    try{
      const response=await fetch(url.toString(),{signal:ctrl.signal,cache:'no-store'});
      if(!response.ok)throw new Error('HTTP '+response.status);
      text=await response.text();
    }finally{clearTimeout(stop);}
    const data=parseCSV(text),seen=new Set();
    for(const row of data){
      const date=row.date,from=(row.from||'').toUpperCase(),to=(row.to||'').toUpperCase(),note=row.note||'';
      const dt=new Date(date+'T00:00:00Z');
      if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(dt.getTime())||dt.toISOString().slice(0,10)!==date||!AIRPORTS[from]||!AIRPORTS[to]||from===to){
        invalid.push(row);continue;
      }
      const key=[date,from,to,note].join('|');if(seen.has(key)){duplicates++;continue;}seen.add(key);
      flights.push({date,year:date.slice(0,4),from,to,note});
    }
    flights.sort((a,b)=>a.date.localeCompare(b.date));
    for(const y of [...new Set(flights.map(f=>f.year))].sort((a,b)=>b.localeCompare(a))){
      const opt=document.createElement('option');opt.value=y;opt.textContent=y;yearMenu.appendChild(opt);
    }
    yearMenu.disabled=flights.length===0;
    yearMenu.addEventListener('change',render);
    render();
    if(!flights.length&&invalid.length)throw new Error('No valid flights. Check airport codes and dates.');
    if(invalid.length||duplicates)console.warn('Flight map ignored',invalid.length,'invalid row(s) and',duplicates,'exact duplicate(s).');
  }
  $('zoom-in').addEventListener('click',()=>changeZoom(1.35));
  $('zoom-out').addEventListener('click',()=>changeZoom(1/1.35));
  $('zoom-reset').addEventListener('click',showUnitedStates);
  $('zoom-world').addEventListener('click',showWorld);
  const svgPoint=map.createSVGPoint();
  function local(e){svgPoint.x=e.clientX;svgPoint.y=e.clientY;const mat=map.getScreenCTM();if(!mat)return {x:W/2,y:H/2};const p=svgPoint.matrixTransform(mat.inverse());return {x:p.x,y:p.y};}
  // Wheel / trackpad zoom is centered at the cursor, with the world as minimum zoom.
  // At the zoom limits, let the page scroll naturally rather than trapping the user.
  map.addEventListener('wheel',e=>{
    const amount=e.deltaY*(e.deltaMode===1?16:e.deltaMode===2?490:1);
    if((view.k<=1.001&&amount>0)||(view.k>=6.999&&amount<0))return;
    const p=local(e);
    changeZoom(Math.exp(-Math.max(-500,Math.min(500,amount))*.0022),p.x,p.y);
    e.preventDefault();
  },{passive:false});
  // Double-click to zoom toward the clicked location.
  map.addEventListener('dblclick',e=>{const p=local(e);changeZoom(1.4,p.x,p.y);e.preventDefault();});
  // Support mouse dragging, one-finger touch panning, and two-finger pinch zoom.
  const pointers=new Map();
  let drag=null,pinch=null;
  const centerOf=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
  const spacing=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  map.addEventListener('pointerdown',e=>{
    if((e.button!==0&&e.pointerType!=='touch')||e.target.classList.contains('route-hit')||e.target.classList.contains('dot'))return;
    const p=local(e);pointers.set(e.pointerId,p);
    map.setPointerCapture(e.pointerId);map.classList.add('dragging');
    if(pointers.size===1){drag={px:p.x,py:p.y,x:view.x,y:view.y};pinch=null;}
    if(pointers.size===2){
      const [a,b]=[...pointers.values()],c=centerOf(a,b);
      pinch={distance:Math.max(1,spacing(a,b)),center:c,view:{...view}};drag=null;
    }
  });
  map.addEventListener('pointermove',e=>{
    if(!pointers.has(e.pointerId))return;
    const p=local(e);pointers.set(e.pointerId,p);
    if(pointers.size===2&&pinch){
      const [a,b]=[...pointers.values()],c=centerOf(a,b);
      const k=Math.max(1,Math.min(7,pinch.view.k*spacing(a,b)/pinch.distance));
      const px=(pinch.center.x-pinch.view.x)/pinch.view.k;
      const py=(pinch.center.y-pinch.view.y)/pinch.view.k;
      view={k,x:c.x-k*px,y:c.y-k*py};clampView();transform();
    }else if(pointers.size===1&&drag){
      view.x=drag.x+p.x-drag.px;view.y=drag.y+p.y-drag.py;
      clampView();transform();
    }
  });
  function endDrag(e){
    pointers.delete(e.pointerId);pinch=null;
    if(pointers.size===1){
      const p=[...pointers.values()][0];drag={px:p.x,py:p.y,x:view.x,y:view.y};
    }else if(pointers.size===0){drag=null;map.classList.remove('dragging');}
  }
  map.addEventListener('pointerup',endDrag);map.addEventListener('pointercancel',endDrag);
  map.addEventListener('lostpointercapture',endDrag);
  // Close the selected-flight card by clicking empty map space.
  map.addEventListener('click',e=>{
    if(!e.target.classList.contains('route-hit')&&!e.target.classList.contains('dot'))hideDetails();
  });
  init().catch(error=>{
    alertBox.textContent='Unable to load flights.csv: '+error.message;
    alertBox.hidden=false;
    console.error('Flight History map:',error);
  });
})();
</script>
</body>
</html>
